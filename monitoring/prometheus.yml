global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'sql_server'
    static_configs:
      - targets: ['host.docker.internal:1433']
    metrics_path: /metrics

  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']

  - job_name: 'api'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: /metrics