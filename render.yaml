services:
  - type: web
    name: marketingiq-api
    runtime: python
    region: oregon
    plan: free
    branch: master
    buildCommand: cd api && pip install -r requirements.txt
    startCommand: cd api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: sqlite:///./google_ads_data.db
    healthCheckPath: /health
