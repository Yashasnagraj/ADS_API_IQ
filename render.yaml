services:
  # FastAPI Backend Service
  - type: web
    name: marketingiq-api
    env: python
    region: oregon
    plan: starter
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --bind 0.0.0.0:$PORT --workers 2 --worker-class uvicorn.workers.UvicornWorker
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: API_VERSION
        value: v1
      - key: CORS_ORIGINS
        sync: false

  # React Frontend Static Site
  - type: web
    name: marketingiq-web
    env: static
    region: oregon
    plan: starter
    rootDir: marketingiq-platform/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_DATA_API_URL
        sync: false
      - key: VITE_AGENT_API_URL
        sync: false
      - key: VITE_CHATBOT_API_URL
        sync: false

